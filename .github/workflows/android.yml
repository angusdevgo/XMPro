name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-tools:
    uses: ./.github/workflows/native-media.yml
    with:
      android: true

  validate:
    needs: native-tools
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore source-built native media executables
        uses: actions/download-artifact@v7
        with:
          pattern: android-tools-*
          path: android/app/src/main/jniLibs/
          merge-multiple: true
      - name: Compile and unit test (debug, never published)
        run: sh android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest -Pxmpro.requireNativeTools=true

  signed:
    needs: native-tools
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version and tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('android/app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"(\d+\.\d+\.\d+)"', text)
          if not match:
              raise SystemExit('build.gradle.kts must declare versionName = "X.Y.Z"')
          version = match.group(1)
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit(f'Tag must equal v{version} from build.gradle.kts')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Restore source-built native media executables
        uses: actions/download-artifact@v7
        with:
          pattern: android-tools-*
          path: android/app/src/main/jniLibs/
          merge-multiple: true
      - name: Restore and validate release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret $name is missing; refusing an unsigned or debug-signed release."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xmpro-release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/xmpro-release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/xmpro-release.der"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xmpro-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: sh android/gradlew -p android :app:assembleRelease -Pxmpro.requireNativeTools=true
      - name: Verify APK signature, package and version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          expected=$(sha256sum "$RUNNER_TEMP/xmpro-release.der" | cut -d' ' -f1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          actual=$(awk '/^Signer #1 certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/apk-cert.txt")
          [[ "$actual" == "$expected" ]] || { echo '::error::APK signing certificate differs from release keystore'; exit 1; }
          package=$("$tools/aapt" dump badging "$apk" | grep '^package:')
          [[ "$package" == *"name='teikengstudio.xmpro'"* ]] || { echo '::error::Unexpected applicationId'; exit 1; }
          [[ "$package" == *"versionName='$APP_VERSION'"* ]] || { echo '::error::Unexpected APK version'; exit 1; }
          mkdir -p release
          cp "$apk" "release/XMPro-$APP_VERSION-android-arm64-v8a.apk"
          (cd release && sha256sum ./*.apk > SHA256SUMS)
      - name: Upload verified release APK
        uses: actions/upload-artifact@v6
        with:
          name: XMPro-${{ steps.version.outputs.version }}-android
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/xmpro-release.jks" "$RUNNER_TEMP/xmpro-release.der" "$RUNNER_TEMP/apk-cert.txt"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [signed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: XMPro-${{ needs.signed.outputs.version }}-android
          path: release
      - name: Publish Android release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          python3 tool/release_notes.py "$RELEASE_TAG" --output release/RELEASE-NOTES.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
          fi

name: Native media tools

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      android:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android:
    if: inputs.android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache source-built Android tools
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            android/app/src/main/jniLibs/${{ matrix.abi }}
            build/android-media/${{ matrix.abi }}/receipt/build-manifest.json
            build/android-media/${{ matrix.abi }}/receipt/outputs.sha256
            build/android-media/${{ matrix.abi }}/receipt/*.elf.txt
          key: android-media-ndk28.2-api24-${{ matrix.abi }}-${{ hashFiles('tool/build_android_media.sh', 'tool/media_sources.json') }}
      - name: Install native host tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm jq make pkg-config
      - name: Install pinned Android NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"'
      - name: Build FFmpeg and FFprobe from verified source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash tool/build_android_media.sh '${{ matrix.abi }}'
      - name: Upload ABI-specific installed executables
        uses: actions/upload-artifact@v6
        with:
          name: android-tools-${{ matrix.abi }}
          path: android/app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native provenance and runtime identity receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-native-evidence-${{ matrix.abi }}
          path: |
            build/android-media/${{ matrix.abi }}/receipt/build-manifest.json
            build/android-media/${{ matrix.abi }}/receipt/outputs.sha256
            build/android-media/${{ matrix.abi }}/receipt/*.elf.txt
          if-no-files-found: warn
          retention-days: 14
